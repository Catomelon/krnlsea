# 99-catosea.conf
# Đặt vào rootfs của Catosea: /etc/sysctl.d/99-catosea.conf
# KHÔNG chép vào máy đang dùng để build trừ khi bạn chủ ý muốn áp lên máy đó.

# Chặn tiến trình ptrace tiến trình khác (cần Yama)
kernel.yama.ptrace_scope = 2

# Ẩn địa chỉ kernel và log khỏi người dùng thường
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1

# BPF chỉ cho root
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# Khóa kexec_load, chỉ còn kexec_file_load có chữ ký
kernel.kexec_load_disabled = 1

kernel.randomize_va_space = 2
kernel.sysrq = 0
kernel.perf_event_paranoid = 2
vm.mmap_min_addr = 65536

# Chống tấn công qua link / file trong thư mục dùng chung
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
fs.suid_dumpable = 0

net.ipv4.conf.all.rp_filter = 1
net.ipv4.tcp_syncookies = 1

# Chỉ bật SAU KHI đã nạp chứng chỉ vào keyring .fs-verity lúc boot,
# nếu bật sớm thì file có fs-verity sẽ không mở được:
# fs.verity.require_signatures = 1

# Cho Waydroid (NAT cho container Android), bật khi cài Waydroid:
# net.ipv4.ip_forward = 1
